*{box-sizing:border-box;margin:0;padding:0}

.badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}

.tropical-badge{background:#b45309;color:#fef3c7}
.choc-badge{background:#3d1a00;color:#fcd34d;border:1px solid #92400e}
.protein-badge{background:#1e3a8a;color:#bfdbfe}
.card-body{padding:0 14px 14px;display:none}
.card-body.open{display:block}
.section-title{font-size:10px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.1em;margin:10px 0 6px}
.ing-grid{display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.ing-name{font-size:11px;color:rgba(255,255,255,0.7);padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.ing-amt{font-size:11px;color:#fcd34d;text-align:right;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-variant-numeric:tabular-nums}
.total-row{display:flex;justify-content:space-between;padding:6px 0 0;font-size:11px;font-weight:600;color:#fff;margin-top:2px}
.steps{margin-top:8px}
.step{font-size:11px;color:rgba(255,255,255,0.6);padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);line-height:1.5}

.step span{color:#fcd34d;font-weight:600;margin-right:4px}
.base-tag{font-size:9px;padding:1px 7px;border-radius:10px;margin-top:3px;display:inline-block}

.neutral-base{background:#065f46;color:#d1fae5}
.icecream-base{background:#78350f;color:#fef3c7}
.kj-tag{font-size:10px;color:rgba(255,255,255,0.4)}

.price-label{font-size:9px;color:rgba(255,255,255,0.4)}
.price-value{font-size:13px;font-weight:700;color:#fcd34d}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter{font-size:10px;padding:3px 10px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);background:transparent}
.filter.on{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.3)}

let currentCat = 'all';

function showCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function toggle(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function render() {
  const filtered = currentCat === 'all' ? drinks : drinks.filter(d => d.cat === currentCat);
  const container = document.getElementById('menu');
  container.innerHTML = filtered.map((d, i) => `
    <div class="card">
      <div class="card-head" onclick="toggle('body_${i}')">
        <div class="card-left">
          <div class="cd-name">${d.cdName}</div>

          <span class="base-tag ${d.base}">${d.baseText}</span>
        </div>
        <div class="card-right">
          <span class="badge ${d.badge}">${d.badgeText}</span>
          <span class="kj-tag">${d.kj}</span>
        </div>
      </div>
      <div class="card-body" id="body_${i}">
        <div class="section-title">Ingredients — 300g yield</div>
        <div class="ing-grid">
          ${d.ingredients.map(([n,a]) => `<div class="ing-name">${n}</div><div class="ing-amt">${a}</div>`).join('')}
          <div class="ing-name" style="font-weight:600;color:#fff;border-top:1px solid rgba(255,255,255,0.2);padding-top:4px;margin-top:2px">Total</div>
          <div class="ing-amt" style="font-weight:600;color:#fff;border-top:1px solid rgba(255,255,255,0.2);padding-top:4px;margin-top:2px">300g</div>
        </div>
        <div class="section-title">Bar Steps</div>
        <div class="steps">
          ${d.steps.map((s,j) => `<div class="step"><span>${j+1}.</span>${s}</div>`).join('')}

        <div class="price-row">
